Synthesize all three agent reports with traceable artifact paths, run IDs, commands, units, seed counts and uncertainty. Separate measured results, interpretations and untested hypotheses. Distinguish historical handoff claims from results reproduced in this workflow. Document unavailable observables and limitations. Write docs/agent_reports/final_report.md. Do not schedule additional experiments or change defaults to resolve a hypothesis without a new user request.
